name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up mise
        uses: jdx/mise-action@v2

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run checks
        run: mise run check

      - name: Run tests
        run: uv run pytest
